name: Architecture rules

on: pull_request

concurrency:
  group: arkitect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arkitect:
    name: Enforce architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis, intl, bcmath, pcntl, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Prepare Symfony application
        run: |
          cp .env.ci .env
          echo "APP_SECRET=$(php -r 'echo bin2hex(random_bytes(16));')" >> .env

      - name: Enforce architecture rules
        run: composer arkitect
